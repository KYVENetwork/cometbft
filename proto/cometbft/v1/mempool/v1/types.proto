syntax = "proto3";
package cometbft.v1.mempool.v1;

option go_package = "github.com/KYVENetwork/cometbft/v1/api/cometbft/mempool/v1";

// Txs contains a list of transaction from the mempool.
message Txs {
  repeated bytes txs = 1;
}

// Message is an abstract mempool message.
message Message {
  // Sum of all possible messages.
  oneof sum {
    Txs txs = 1;
  }
}
