syntax = "proto3";
package cometbft.v1.types.v1;

option go_package = "github.com/KYVENetwork/cometbft/v1/api/cometbft/types/v1";

import "cometbft/v1/types/v1/types.proto";
import "cometbft/v1/types/v1/evidence.proto";
import "gogoproto/gogo.proto";

// Block defines the structure of a block in the CometBFT blockchain.
message Block {
  Header       header      = 1 [(gogoproto.nullable) = false];
  Data         data        = 2 [(gogoproto.nullable) = false];
  EvidenceList evidence    = 3 [(gogoproto.nullable) = false];
  Commit       last_commit = 4;
}
